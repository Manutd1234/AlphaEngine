# AlphaEngine's stateful gateway runs separately from the Vercel web UI.
# Secrets use `sync: false` so Render prompts for them during initial setup and
# they never need to be committed to this repository.
services:
  - type: web
    name: alphaengine-gateway
    runtime: python
    region: singapore
    plan: starter
    rootDir: Part2_Infrastructure
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: alphaengine-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_AUTH
        value: "1"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: DB_PATH
        value: /opt/render/project/src/data/alphaengine.duckdb
      - key: WEB_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODE
        value: polling
      - key: TELEGRAM_ALLOWED_USER_IDS
        value: "1227841784"
