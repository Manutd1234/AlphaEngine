# Continuous integration for the three deployable units.
#
# The suites are network-free by design: market data is disabled, the backtester
# falls back to its NumPy engine, and every fixture is committed. So this
# workflow needs no secrets and no services — only dependency installs reach the
# network, and a red build means the code broke, never that an exchange was slow.
#
# ONE JOB NOW FETCHES A MODEL, and the sentence above is amended rather than
# quietly falsified. `rerank-real` seeds the cross-encoder's ONNX weights in a
# SETUP step and then runs its test offline against that directory — which is
# the same shape as a dependency install (a build-time fetch, never a test-time
# one), and is precisely what `Part2_Infrastructure/requirements-rerank.txt` has
# always prescribed: "do it at image build time, never on the request path". It
# is opt-in and cannot affect the three jobs above; see its own header.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.12 is the one version satisfying both units: the gateway supports
  # 3.11-3.14, the OpenBB service requires >=3.12,<3.15.
  PYTHON_VERSION: "3.12"

# ACTION VERSIONS, and why these ones.
#
# GitHub now forces actions built on the Node 20 runtime onto Node 24 and warns;
# eventually it will stop. `actions/checkout@v4` and `supabase/setup-cli@v1`
# were the two still on it, so every action here moved to a current major.
#
# Each documented breaking change was checked against this repository rather
# than assumed harmless:
#   - checkout v5+ changes the default for `pull_request_target` checkouts.
#     Nothing here uses that trigger, and the only input passed anywhere is
#     `fetch-depth: 0`, which is unchanged.
#   - setup-node v5 caches automatically when `package.json` carries a
#     `packageManager` field. Neither package.json does, and both call sites
#     pass `cache` and `cache-dependency-path` explicitly regardless.
#   - setup-cli v3 installs from npm and removes `github-token`; see schema.yml.
#
# These are the CI TOOLCHAIN, not the runtimes. The runtimes are pinned to what
# the code is tested against and do not follow "latest": `PYTHON_VERSION` above,
# and Node from `.nvmrc` at the repo root, which is the single place that number
# is written.

jobs:
  gateway:
    name: Gateway (pytest + ruff + API contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2_Infrastructure
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Every file requirements-dev.txt includes, not just the one it names:
          # the cache key is a hash of these, and a bump inside an included file
          # would otherwise restore a cache that predates it.
          cache-dependency-path: |
            Part2_Infrastructure/requirements-dev.txt
            Part2_Infrastructure/requirements-core.txt
            Part2_Infrastructure/requirements-native.txt
            Part2_Infrastructure/requirements-communities.txt
            Part2_Infrastructure/requirements-ml.txt
      - run: pip install -r requirements-dev.txt

      # The suite runs native-by-default (DECISION_CORE=auto), so the parity
      # tests need the extension present. requirements-dev.txt pulls in the
      # build toolchain; building it here also makes a broken core a red build.
      - name: Build native decision core
        run: python native/decision_core/setup.py build_ext --inplace --build-temp build/native

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest

      # The committed OpenAPI snapshot is the contract two separately deployed
      # clients rely on; regenerating it must be a deliberate, reviewable act.
      - name: API schema is up to date
        run: python tools/export_openapi.py --check

      # End-to-end smoke over the money path: book -> cost -> risk gate -> audit.
      - name: Money-path probe
        run: python tools/synthetic_probe.py

  native-sanitizers:
    name: Native decision core (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Part2_Infrastructure
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Part2_Infrastructure/requirements-dev.txt
            Part2_Infrastructure/requirements-core.txt
            Part2_Infrastructure/requirements-native.txt
            Part2_Infrastructure/requirements-communities.txt
            Part2_Infrastructure/requirements-ml.txt
      - run: pip install -r requirements-dev.txt

      # Separate from the production build above: its O3/float contract stays
      # untouched, while this extension carries memory/UB instrumentation and
      # promotes every supported compiler warning to a build failure.
      - name: Build strict sanitized decision core
        env:
          ALPHAENGINE_NATIVE_SANITIZERS: "1"
        run: >-
          python native/decision_core/setup.py build_ext --inplace --force
          --build-temp build/native-sanitize

      - name: Verify sanitizer runtimes are linked
        run: |
          set -euo pipefail
          ldd modules/_decision_core*.so | tee /tmp/decision-core-libraries.txt
          grep -q 'libasan' /tmp/decision-core-libraries.txt
          grep -q 'libubsan' /tmp/decision-core-libraries.txt

      - name: Native parity and breakage corpus under ASan and UBSan
        env:
          DECISION_CORE: native
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          asan_runtime="$(gcc -print-file-name=libasan.so)"
          ubsan_runtime="$(gcc -print-file-name=libubsan.so)"
          test -f "$asan_runtime"
          test -f "$ubsan_runtime"
          export LD_PRELOAD="$asan_runtime:$ubsan_runtime"
          python -m pytest \
            tests/test_decision_core_contract.py \
            tests/test_decision_core_native.py \
            tests/test_native_input_validation.py \
            tests/test_native_loader_symbols.py \
            tests/test_native_result_boundary.py \
            tests/test_position_book_parity.py \
            tests/test_core_self_measure.py \
            tests/test_gate_parity.py \
            tests/test_file_size.py \
            tests/test_container_contract.py

  openbb-service:
    name: OpenBB research service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2_Infrastructure/OpenBB_Service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Part2_Infrastructure/OpenBB_Service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: Web workspace (tests + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2_Infrastructure/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Read from .nvmrc rather than repeated here. Node 22 was declared in
          # three places; a bump that missed one would have CI testing a version
          # nobody develops on, silently.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Part2_Infrastructure/web/package-lock.json
      - run: npm ci
      - name: Tests
        # pipefail is mandatory: GitHub's default bash does not set it, and
        # `| tee` alone would mask a red suite behind tee's exit 0.
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/web-tests.log"
      # The count the Developer console displays must be the count the runner
      # just printed. Asserting this from inside the suite is impossible — a
      # test checking the total changes the total — so the gate lives here,
      # one step outside it.
      - name: Committed test counts match the suite
        run: node scripts/check-test-counts.mjs web "$RUNNER_TEMP/web-tests.log"
      # Includes the Python/TypeScript engine parity suite: two implementations
      # of the same accounting are two chances to be wrong.
      - name: Typecheck
        run: npm run typecheck
      # A type-safe component can still fail during Next's route analysis,
      # metadata generation or production bundling. CI must exercise the same
      # artifact Vercel will deploy, not only the source graph.
      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Live connectivity — workflow_dispatch ONLY, and deliberately so.
  #
  # The three jobs above are network-free by design (see this file's header): a
  # red build must mean the code broke, never that a service was slow. Putting an
  # ADB probe in `pull_request` would trade that guarantee away — an Always Free
  # Autonomous Database auto-stops when idle, so a perfectly good PR would go red
  # because nobody had queried the database in a week.
  #
  # It skips cleanly when the secrets are absent, which is every fork and every
  # clone, so it is opt-in rather than broken-by-default.
  # ---------------------------------------------------------------------------
  live-smoke:
    name: Live services (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Read from .nvmrc rather than repeated here. Node 22 was declared in
          # three places; a bump that missed one would have CI testing a version
          # nobody develops on, silently.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Part2_Infrastructure/web/package-lock.json

      - name: Are the secrets present?
        id: gate
        run: |
          # The repository stores these as DB_* — the names the deployment
          # runbook uses. The app reads ORACLE_*, so they are mapped at the step
          # below rather than renamed in either place.
          if [ -n "${{ secrets.DB_CONNECTION_STRING }}" ] && [ -n "${{ secrets.DB_PASSWORD }}" ]; then
            echo "oracle=yes" >> "$GITHUB_OUTPUT"
          else
            echo "oracle=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DB_CONNECTION_STRING / DB_PASSWORD absent — skipping the ADB probe."
          fi
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "supabase=yes" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase URL absent — skipping the PostgREST probe."
          fi

      - if: steps.gate.outputs.oracle == 'yes'
        working-directory: Part2_Infrastructure/web
        run: npm ci

      # Connects over walletless TLS or the configured mTLS wallet, checks both
      # schema objects exist, and runs one small Monte Carlo. Its error taxonomy
      # names the fix for each failure rather than printing an ORA stack.
      - name: Oracle Autonomous Database
        if: steps.gate.outputs.oracle == 'yes'
        working-directory: Part2_Infrastructure/web
        env:
          ORACLE_CONN_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ORACLE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_WALLET_PEM_B64: ${{ secrets.ORACLE_WALLET_PEM_B64 }}
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
        run: node scripts/verify-oracle.mjs

      # A HEAD against PostgREST proves reachability and that the anon key is
      # accepted, without reading a row — deny-by-default RLS means anon can
      # read nothing, and a 200 here would actually be the bug.
      - name: Supabase PostgREST reachable
        if: steps.gate.outputs.supabase == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/order_blotter?select=id&limit=1")
          echo "PostgREST returned $code"
          case "$code" in
            401|403) echo "Reachable, and anon is correctly denied by RLS." ;;
            200)     echo "::error::anon can READ order_blotter — RLS is not deny-by-default"; exit 1 ;;
            *)       echo "::error::unexpected status $code"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # The cross-encoder re-ranker, against the REAL weights — opt-in.
  #
  # `modules/research_rerank.py` shipped as a code path nothing had executed:
  # fastembed is an optional extra, RERANK_MODEL_PATH is empty in every normal
  # deployment, no step anywhere seeded weights, and every test drove a fake
  # scorer. A fake can prove that the module sorts descending by the numbers it
  # was handed. It cannot prove that the model gives the RELEVANT document the
  # higher number, and a cross-encoder wired up backwards passes the whole fake
  # suite. This job is where that gets proved.
  #
  # A SEPARATE JOB, not a step in `gateway`, and the reason is 1.05 GiB. That is
  # the measured size of BAAI/bge-reranker-base's fp32 ONNX blob (one file of
  # 1,112,459,588 bytes; ~22 s to fetch cold), on top of installing onnxruntime.
  # `gateway` is the job that gates every push, and hanging a gigabyte off it
  # would slow the default red/green for everyone in exchange for exercising an
  # optional extra that a normal deployment does not configure at all.
  #
  # OPT-IN, not on `pull_request`, for the reason in this file's header. The
  # weights come from a third-party hub that rate-limits unauthenticated
  # downloads — a PR-gating job that fetched them would go red because a hub was
  # busy, which is the exact failure the header forbids. `live-smoke` above is
  # opt-in for the same class of reason. Two ways in: dispatch the workflow, or
  # put the `rerank` label on a pull request that touches this code, so a
  # reviewer can ask for it without leaving the PR.
  #
  # The weights are CACHED, so only the first run per requirements change pays
  # the fetch, and the seed step is skipped entirely on a hit.
  #
  # requirements-core.txt rather than requirements-dev.txt: this job proves the
  # re-ranker, not the tree. `gateway` proves the tree, and pulling numba and
  # scikit-learn in here as well would double the install for nothing.
  # ---------------------------------------------------------------------------
  rerank-real:
    name: Cross-encoder re-ranker (real weights, opt-in)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'rerank')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2_Infrastructure
    env:
      RERANK_WEIGHTS: ${{ github.workspace }}/.rerank-weights
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Part2_Infrastructure/requirements-core.txt
            Part2_Infrastructure/requirements-rerank.txt
      - run: pip install -r requirements-core.txt -r requirements-rerank.txt

      # Keyed on the pin rather than on the lock: requirements-rerank.txt pins
      # fastembed to a line precisely because a re-ranker that scores
      # differently between releases re-orders what the desk was shown, so a
      # bump to that pin is exactly when these weights must be re-fetched.
      - name: Cache the cross-encoder weights
        id: weights
        uses: actions/cache@v4
        with:
          path: ${{ env.RERANK_WEIGHTS }}
          key: bge-reranker-base-${{ hashFiles('Part2_Infrastructure/requirements-rerank.txt') }}

      # THE ONE NETWORKED STEP IN THIS FILE, and it is setup rather than test.
      # `tools/bench_rerank.py --seed` is the same call an image build makes, so
      # CI and the deployment seed the weights through one code path instead of
      # two that can disagree about where they go.
      - name: Seed the weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: python tools/bench_rerank.py --seed --model-path "$RERANK_WEIGHTS"

      # HF_HUB_OFFLINE is the assertion, not a precaution. "No network at
      # request time once the model directory is seeded" is the whole argument
      # for choosing local ONNX over Cohere or Voyage; running the suite with
      # the hub switched off is what turns that sentence into a test.
      #
      # The grep is the other half. A suite that skipped would leave this job
      # green having proved nothing — the "summary still reads green while the
      # engine goes untested" failure requirements.txt warns about — so the one
      # job that exists to run the real model fails if the real model did not
      # run. Count the skips, not the passes.
      - name: Real model, offline, against the seeded directory
        env:
          RERANK_TEST_MODEL_PATH: ${{ env.RERANK_WEIGHTS }}
          HF_HUB_OFFLINE: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_research_rerank_real.py -q -rs 2>&1 \
            | tee "$RUNNER_TEMP/rerank-real.log"
          if grep -q "skipped" "$RUNNER_TEMP/rerank-real.log"; then
            echo "::error::the real-model suite SKIPPED in the job that exists to run it"
            exit 1
          fi

      # The mirror of the step above, and it is what protects the other three
      # jobs. tests/conftest.py blanks RERANK_MODEL_PATH by assignment so that
      # no suite can ever load ~110M parameters off a directory nobody
      # mentioned; the opt-in variable is a SECOND name that conftest does not
      # touch. With it unset, on a runner where the weights are sitting on disk
      # and fastembed is installed, the real file must still skip and the fake
      # suite must still pass. If that ever stops being true, the default suite
      # has started depending on weights.
      - name: The default suite is still weight-free
        run: |
          set -o pipefail
          python -m pytest tests/test_research_rerank.py tests/test_research_rerank_real.py \
            -q -rs 2>&1 | tee "$RUNNER_TEMP/rerank-default.log"
          grep -Eq '^SKIPPED \[1\] tests/test_research_rerank_real\.py:' \
            "$RUNNER_TEMP/rerank-default.log" || {
            echo "::error::the real-model file did not skip with the opt-in unset"
            exit 1
          }

      # Publishes the numbers into the job log for THIS runner's core count.
      # research_rerank's docstring and research_stages._RERANK_BULKHEAD both
      # quote a measured table taken on an 18-core arm64 laptop; onnxruntime
      # sizes its intra-op pool from the cores it finds, so those figures are a
      # property of that machine. This is how the same table gets taken on a
      # runner, which is the number the bulkhead argument actually needs.
      - name: Bench the re-ranker on this runner
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python tools/bench_rerank.py --model-path "$RERANK_WEIGHTS" \
            --repeat 3 --concurrency 1,2 --threads 1,2,4

  repo-audit:
    name: Committed tree is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the guard exports HEAD with git archive
      # Catches the failure mode where a file builds locally but was never
      # committed because a .gitignore pattern silently matched it.
      - run: bash Part2_Infrastructure/tools/check_repo_complete.sh --fast
