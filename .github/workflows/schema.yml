# Apply the committed database schema to Oracle ADB and Supabase.
#
# MANUAL ON PURPOSE. Everything here is DDL against a live database, and DDL
# that rides a code deploy is how a table gets altered by someone who was
# shipping a CSS change. `deploy.yml` ships the application; this ships the
# schema, and the two move at different speeds by design.
#
# It is safe to re-run. Every statement in `oracle/*.sql` is wrapped to swallow
# only its own "already exists" code, and `supabase db push` skips migrations
# already recorded — so this is the same job on a fresh database and on one that
# is already current, which is what makes it usable as a repair tool rather than
# a one-shot.
#
#   Actions → Apply database schema → Run workflow
#
# A manually selected target must have its complete connection pair. Silently
# skipping a selected database would turn a green run into a false apply report.

name: Apply database schema

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which database to apply"
        type: choice
        options: [both, oracle, supabase]
        default: both
      dry_run:
        description: "Parse and list the statements without connecting"
        type: boolean
        default: false
      repair_legacy_history:
        description: "One-time: mark the verified 20260820 legacy objects as applied before pushing"
        type: boolean
        default: false

concurrency:
  # Two concurrent applies against one database would race on the same CREATE.
  group: schema
  cancel-in-progress: false

jobs:
  credential-gate:
    name: Selected database credentials
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected connection pair
        env:
          TARGET: ${{ inputs.target }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=()
          case "$TARGET" in
            both|oracle)
              [ -n "$DB_CONNECTION_STRING" ] || missing+=("DB_CONNECTION_STRING")
              [ -n "$DB_PASSWORD" ] || missing+=("DB_PASSWORD")
              ;;
          esac
          case "$TARGET" in
            both|supabase)
              [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
              [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
              ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The selected schema target is missing required repository secrets: ${missing[*]}"
            exit 1
          fi

  oracle:
    name: Oracle Autonomous Database
    needs: credential-gate
    if: inputs.target == 'both' || inputs.target == 'oracle'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2_Infrastructure
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Thin mode: a pure-Python implementation of the wire protocol, so no
      # Instant Client download and no LD_LIBRARY_PATH. It is also the same mode
      # the web routes use, which means a success here proves their path.
      # httpx comes from `modules.research_rag`, which the backfill imports for
      # `render_backtest_card`. The Oracle and Supabase corpora must be built
      # from byte-identical card text or their vectors are not comparable, so
      # that renderer is imported rather than restated — and importing it pulls
      # the module's own dependency.
      - run: pip install oracledb httpx

      - name: Parse the DDL
        run: python tools/apply_oracle_schema.py --dry-run

      - name: Secrets present?
        id: gate
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_CONNECTION_STRING" ] && [ -n "$DB_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::error::Oracle was selected, but DB_CONNECTION_STRING / DB_PASSWORD is incomplete."
            exit 1
          fi

      - name: Apply
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        env:
          # The repository stores these under DB_*; the app reads ORACLE_*.
          # Mapped here rather than renamed on either side.
          ORACLE_CONN_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ORACLE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          # Optional mutual-TLS credentials. Walletless ADB connections use
          # only the connect string and password; databases that still require
          # mTLS additionally provide this pair.
          ORACLE_WALLET_PEM_B64: ${{ secrets.ORACLE_WALLET_PEM_B64 }}
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
        run: python tools/apply_oracle_schema.py

      # Proves the objects the routes bind against actually resolve. Applying
      # DDL and never selecting from it is how a typo in a column name survives
      # to the first page load.
      - name: Verify from the app's own probe
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        working-directory: Part2_Infrastructure/web
        env:
          ORACLE_CONN_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ORACLE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_WALLET_PEM_B64: ${{ secrets.ORACLE_WALLET_PEM_B64 }}
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
        run: |
          npm ci
          node scripts/verify-oracle.mjs

      # An empty corpus answers every query with "nothing similar is recorded",
      # which the UI renders honestly and which therefore nobody investigates.
      # Applying the schema without ever populating it is how the Oracle vector
      # search stayed complete, correct and permanently useless.
      #
      # Idempotent: MERGE on the table's own (kind, source_ref) unique key, so
      # this is the same job on a fresh database and on a current one.
      - name: Index the desk's backtest history
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        env:
          ORACLE_CONN_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ORACLE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_WALLET_PEM_B64: ${{ secrets.ORACLE_WALLET_PEM_B64 }}
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
          # Reads the history over the gateway's audit API and embeds through
          # its embed route, so the vectors come from the same gte-small session
          # that embedded the Supabase corpus. A vector from any other model is
          # not comparable to those, and would rank confident nonsense.
          # Deployment-specific, deliberately not baked into the workflow.
          # Configure this repository variable with the gateway origin.
          ALPHAENGINE_GATEWAY_URL: ${{ vars.ALPHAENGINE_GATEWAY_URL }}
          WEB_API_TOKEN: ${{ secrets.WEB_API_TOKEN }}
        # NOT `continue-on-error`. It was, and it reported this step as a
        # success while the script died on a missing import — the corpus stayed
        # empty and the run stayed green, which is the failure shape this whole
        # repository keeps tripping over. The workflow is manual, so a red run
        # blocks nothing and is the only way anyone finds out.
        run: |
          case "$ALPHAENGINE_GATEWAY_URL" in
            https://*) ;;
            *)
              echo "::error::ALPHAENGINE_GATEWAY_URL must be a configured HTTPS origin; refusing to send WEB_API_TOKEN over plaintext."
              exit 1
              ;;
          esac
          python tools/backfill_oracle_rag.py --limit 200

  supabase:
    name: Supabase migrations and functions
    needs: credential-gate
    if: inputs.target == 'both' || inputs.target == 'supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secrets present?
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::error::Supabase was selected, but SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD is incomplete."
            echo "::error::Create a token at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      # v3 installs the CLI from npm rather than from GitHub releases, and
      # DROPS the `github-token` input. Safe here only because this step never
      # passed one — `version: latest` is the whole configuration, and v3 still
      # accepts it. Check that before bumping this again.
      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.ready == 'yes'
        with:
          version: latest

      - name: Link the project
        if: steps.gate.outputs.ready == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # The ref comes from the committed config.toml, so it cannot drift from
        # what the migrations were written against.
        run: |
          ref="$(grep -oE 'project_id = "[a-z0-9]+"' supabase/config.toml | cut -d'"' -f2)"
          if [ -z "$ref" ]; then
            echo "::error::supabase/config.toml contains no valid project_id"
            exit 1
          fi
          echo "Linking $ref"
          supabase link --project-ref "$ref"

      # This production project predates the committed migration ledger. The
      # relations, policies and RPCs through 20260820100500 are present (and
      # were probed through PostgREST), but their versions are absent from
      # supabase_migrations.schema_migrations. Replaying the first batch would
      # fail on its intentionally non-idempotent CREATE TABLE / CREATE TYPE
      # statements before any of the genuinely missing Diffusion migrations
      # could run. This explicit, manual-only repair advances history only to
      # the last object verified live. The idempotent 20260820100600 security
      # revokes intentionally replay, and 20260820100700 also stays pending:
      # the live research_doc_kind enum still lacks `chart`, so both it and
      # every successor must be applied normally.
      - name: Repair verified legacy migration history
        if: steps.gate.outputs.ready == 'yes' && inputs.repair_legacy_history && !inputs.dry_run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for version in \
            20260820090000 \
            20260820090100 \
            20260820090200 \
            20260820090300 \
            20260820090400 \
            20260820090500 \
            20260820090600 \
            20260820100000 \
            20260820100100 \
            20260820100200 \
            20260820100300 \
            20260820100400 \
            20260820100500
          do
            supabase migration repair "$version" --status applied
          done

      - name: Show what would change
        if: steps.gate.outputs.ready == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Push migrations
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # verify_jwt stays ON for embed-research: the gateway calls it with the
      # service-role key and anon must get a 401. evaluate-order is deployed
      # WITHOUT it so an unauthenticated call gets a clean 401 from the
      # function's own getUser() check rather than an opaque one from the edge.
      - name: Deploy edge functions
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy embed-research
          supabase functions deploy evaluate-order --no-verify-jwt

      - name: Confirm anon is still denied
        if: steps.gate.outputs.ready == 'yes' && !inputs.dry_run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY absent — skipping the RLS probe."
            exit 0
          fi
          # The migration grants anon SELECT on order_blotter scoped to the demo
          # desk, and grants nothing at all on desk_risk_limits. That second
          # revoke is the one worth proving after a push: it is where the desk's
          # configured thresholds live, and publishing them tells anyone how to
          # size an order that passes the gates.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/desk_risk_limits?select=id&limit=1")
          echo "anon → desk_risk_limits: $code"
          case "$code" in
            401|403|404) echo "Correctly denied." ;;
            200) echo "::error::anon can read desk_risk_limits — the REVOKE was lost"; exit 1 ;;
            *) echo "::error::unexpected status $code"; exit 1 ;;
          esac
