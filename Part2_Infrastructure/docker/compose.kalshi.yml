# Opt-in local Kalshi signing for the root docker-compose.yml.
#
# Keep this separate from the base file: a clean clone has no private key and
# ordinary `docker compose up` must remain keyless. Run from the repository root:
#
#   docker compose -f docker-compose.yml \
#     -f Part2_Infrastructure/docker/compose.kalshi.yml up -d --build
#
# All relative paths in a multi-file Compose application resolve from the first
# (base) file. The read-only source directory below therefore holds the same
# ignored PEMs named by the host-side paths in Part2_Infrastructure/.env. The
# demo PEM is required by this opt-in override. The production PEM remains
# optional, but its file and KALSHI_PRODUCTION_KEY_ID must appear together.

services:
  kalshi-demo-key-install:
    image: alphaengine-gateway:local
    user: "0:0"
    env_file:
      - path: ./Part2_Infrastructure/.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        umask 077;
        incoming=/run/secrets/kalshi-demo-private-key.pem.next;
        target=/run/secrets/kalshi-demo-private-key.pem;
        production_source=/source/kalshi-production-private-key.pem;
        production_incoming=/run/reference-secrets/kalshi-production-private-key.pem.next;
        production_target=/run/reference-secrets/kalshi-production-private-key.pem;
        production_configured=0;
        cleanup() { rm -f "$${incoming}" "$${production_incoming}" || true; };
        trap cleanup EXIT;
        rm -f "$${incoming}" "$${production_incoming}";
        if [ -n "$${KALSHI_PRODUCTION_KEY_ID:-}" ]; then
          [ -f "$${production_source}" ] || { echo "KALSHI_PRODUCTION_KEY_ID requires secrets/kalshi-production-private-key.pem" >&2; exit 1; };
          production_configured=1;
        elif [ -f "$${production_source}" ]; then
          echo "secrets/kalshi-production-private-key.pem requires KALSHI_PRODUCTION_KEY_ID" >&2;
          exit 1;
        fi;
        python -c 'import sys; from cryptography.hazmat.primitives import serialization; from cryptography.hazmat.primitives.asymmetric.rsa import RSAPrivateKey; key = serialization.load_pem_private_key(open("/source/kalshi-demo-private-key.pem", "rb").read(), password=None); sys.exit(0 if isinstance(key, RSAPrivateKey) else "Kalshi demo key must be RSA")';
        if [ "$${production_configured}" = "1" ]; then python -c 'import sys; from cryptography.hazmat.primitives import serialization; from cryptography.hazmat.primitives.asymmetric.rsa import RSAPrivateKey; key = serialization.load_pem_private_key(open("/source/kalshi-production-private-key.pem", "rb").read(), password=None); sys.exit(0 if isinstance(key, RSAPrivateKey) else "Kalshi production key must be RSA")'; fi;
        cp /source/kalshi-demo-private-key.pem "$${incoming}";
        chown 10001:10001 "$${incoming}";
        chmod 0400 "$${incoming}";
        if [ "$${production_configured}" = "1" ]; then
          cp "$${production_source}" "$${production_incoming}";
          chown 10001:10001 "$${production_incoming}";
          chmod 0400 "$${production_incoming}";
        fi;
        mv "$${incoming}" "$${target}";
        if [ "$${production_configured}" = "1" ]; then mv "$${production_incoming}" "$${production_target}"; else rm -f "$${production_target}"; fi;
        trap - EXIT
    volumes:
      - type: bind
        source: ./Part2_Infrastructure/secrets
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - kalshi_demo_key:/run/secrets
      - kalshi_production_key:/run/reference-secrets
    restart: "no"

  gateway:
    depends_on:
      kalshi-demo-key-install:
        condition: service_completed_successfully
    environment:
      KALSHI_DEMO_PRIVATE_KEY_PATH: /run/secrets/kalshi-demo-private-key.pem
      KALSHI_PRODUCTION_PRIVATE_KEY_PATH: /run/reference-secrets/kalshi-production-private-key.pem
    volumes:
      - kalshi_demo_key:/run/secrets:ro
      - kalshi_production_key:/run/reference-secrets:ro

volumes:
  kalshi_demo_key:
  kalshi_production_key:
